# Builds the Yummy customer app as an Android APK (debug-signed, installable by sideloading)
# and publishes it as the "apk-latest" release so it can be downloaded from the Releases page.
name: Build Android APK

on:
  push:
    branches: [main, feat/android-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Yummy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yummy-apk
          path: Yummy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Yummy.apk \
            --title "Yummy Android app (latest)" \
            --notes "Debug-signed APK built from commit ${GITHUB_SHA::7}. Install by allowing 'install unknown apps' on your phone." \
            --target "$GITHUB_SHA"
